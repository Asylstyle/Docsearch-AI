services:
  db:
    image: pgvector/pgvector:pg16
    restart: on-failure
    environment:
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: docsearch
      POSTGRES_DB: docsearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: on-failure
    volumes:
      - model_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://docsearch:docsearch@db:5432/docsearch}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-terra}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-100}
      SEARCH_MODE: ${SEARCH_MODE:-e5}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  model_cache:
